; Minimal PHP2Shell lab configuration, not a production php.ini template.
; Package-specific extensions and paths remain deployment-specific.
; Upload progress is deliberately enabled for the mitigation exercise.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 128M
max_execution_time = 30
max_input_time = 60
post_max_size = 16M
file_uploads = On
upload_max_filesize = 8M
allow_url_fopen = On
allow_url_include = Off

[Date]
date.timezone = UTC

[Session]
session.auto_start = 0
session.save_handler = files
session.serialize_handler = php
session.use_cookies = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.upload_progress.enabled = 1
